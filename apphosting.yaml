runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

buildConfig:
  commands:
    - npm install --no-package-lock --legacy-peer-deps

# The backend must provide NEXT_PUBLIC_SQUARE_LINK_LIGHT,
# NEXT_PUBLIC_SQUARE_LINK_STANDARD and NEXT_PUBLIC_SQUARE_LINK_PRO at BUILD
# and RUNTIME. Keep the existing payment URLs in the backend configuration.
# Verify in that build environment: npm run check:payment-env
# Changes to these public variables require a new build and rollout.
# Firestore indexes are deployed separately from App Hosting:
# npm run check:firestore-indexes -- --project PROJECT_ID
# Add only missing indexes with the same command plus --apply, then wait for READY.
# Do not deploy a partial index list with deletion/force options.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyC3OQwAVStMx3Ak7xjKlSqt_HjxwK_BxhA
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: push-taro-machiokoshi.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: push-taro-machiokoshi
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: push-taro-machiokoshi.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "896726381284"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:896726381284:web:803881394acfce9dd2f2f1"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BIyqPrdtrG8Ig8COh2RZh_-4IrZXKN4FS7LeSbFF_73seAd8BTZ_DgIXXPhNMbA1hvOp_zY5UDKzdrRhvPLFGW8
    availability:
      - BUILD
      - RUNTIME
  - variable: INFOMAIL_USER
    secret: INFOMAIL_USER
    availability:
      - RUNTIME
  - variable: INFOMAIL_PASS
    secret: INFOMAIL_PASS
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
